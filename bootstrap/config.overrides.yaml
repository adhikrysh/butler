# Repo-owned Hermes config — the GitOps source of truth for Butler's config
# policy. setup_butler.sh writes the full config.yaml at first boot; the deploy
# ENFORCES the keys below on every change. Edit a value here, push, and
# deploy.sh deep-merges it onto the live profile config.yaml + restarts the
# gateway when something actually changed — so config ships through git, never
# SSH. Keys NOT listed here are left untouched (Hermes defaults, OAuth/runtime
# state, the terminal sandbox block).

# Default model — a model bump ships via push, not a box edit.
model:
  default: gpt-5.5

# Write-protection: these host-side toolsets bypass the read-only-repo sandbox
# (they run in-process as the user, not in the docker terminal), so keep them
# disabled. `file` = read/write/patch files; `code_execution` = run arbitrary
# Python — both can write the repo working tree and jam the pull-based deploy.
# Butler routes all real work through `terminal` (docker, repo mounted ro) + MCP,
# so neither is needed. Belt-and-suspenders if Hermes regenerates the toolset
# list on upgrade. The remaining skill-write path (`skill_manage`) can't be
# disabled per-tool, so it's blocked by the pre_tool_call hook below instead.
agent:
  disabled_toolsets:
    - file
    - code_execution

# Skills are READ-ONLY to the agent. `skill_manage` (create/edit/patch/delete)
# is bundled with the read tools `skill_view`/`skills_list` in the one `skills`
# toolset, and Hermes has no per-tool disable — so we hard-block just the writer
# with a pre_tool_call hook (matcher = exact tool name, via fullmatch). The agent
# keeps reading its skills; it cannot rewrite them. Instead it logs skill-
# improvement ideas via the `learnings` skill (`learn.py`); a weekly digest
# surfaces them, and the user promotes the good ones into skills via git.
# `hooks_auto_accept` is required or the headless gateway silently skips
# registering the hook (non-TTY consent gate). See bootstrap/hooks/.
hooks_auto_accept: true
hooks:
  pre_tool_call:
    - matcher: skill_manage
      command: /home/drc/butler/bootstrap/hooks/block_skill_manage.py
      timeout: 10

# Deliver cron / no-agent output to Telegram raw — no "Job ID" + metadata
# header/footer wrapper (Hermes wraps by default).
cron:
  wrap_response: false
